<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Gestione Squadra — Sola lettura</title>
  <link rel="stylesheet" href="style.css?v=3.1"/>
  <meta name="theme-color" content="#060812"/>
  <style>
    /* Vista sola lettura: nasconde qualsiasi azione di modifica/stampa */
    .readonly-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-weight:800}
    .readonly-badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}
    .ro-actions,.actions,.grid-actions,.a,.btnPrint,.print-header{display:none !important;}
    .card-sub{max-width:60ch}
    @media print{ body{ display:none !important; } }
  </style>
</head>
<body>
  <div aria-hidden="true" class="bg"><div class="bg-honey"></div><div class="bg-glow"></div></div>

  <header class="top">
    <div class="brand">
      <div class="brand-text">
        <div class="brand-title" id="vTeamTitle">Gestione Squadra</div>
        <div class="brand-sub" id="vTeamSub">Sola lettura</div>
      </div>
    </div>
    <div class="readonly-badge" title="Sola visualizzazione">
      <span class="dot"></span>
      <span>VIEW</span>
    </div>
  </header>

  <main class="main">
    <section class="page" id="v-presenze">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Presenze</div>
            <div class="card-sub" id="vMonthTitle">—</div>
          </div>
          <div class="actions">
            <label class="inline"><span>Mese</span><select id="vMonthSelect"></select></label>
          </div>
        </div>
        <div class="card-body">
          <div class="table-wrap compact" id="vAttendanceTable"></div>
          <div class="summary-wrap" id="vAttendanceSummary"></div>
        </div>
      </div>
    </section>

    <section class="page hidden" id="v-rosa">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Rosa</div>
            <div class="card-sub">Solo visualizzazione.</div>
          </div>
        </div>
        <div class="card-body">
          <div class="roster" id="vRosterList"></div>
        </div>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button class="nav-item active" data-tab="presenze" type="button"><span class="ni-ico">🏃</span><span class="ni-txt">Presenze</span></button>
    <button class="nav-item" data-tab="rosa" type="button"><span class="ni-ico">👥</span><span class="ni-txt">Rosa</span></button>
  </nav>

  <script src="share.js?v=3.1"></script>
  <script>
    // blocca stampa (non è sicurezza assoluta, ma evita stampa/CTRL+P)
    window.print = ()=>alert('Stampa disabilitata in modalità sola lettura.');
    window.addEventListener('keydown', (e)=>{
      const k = (e.key||'').toLowerCase();
      if((e.ctrlKey||e.metaKey) && k==='p'){ e.preventDefault(); alert('Stampa disabilitata in modalità sola lettura.'); }
    }, {capture:true});
  </script>
</body>
</html>
