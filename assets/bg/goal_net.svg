<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062015"/>
      <stop offset="1" stop-color="#041611"/>
    </linearGradient>
    <pattern id="net" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0 L40 40 M40 0 L0 40" stroke="rgba(13,220,122,0.35)" stroke-width="2"/>
      <path d="M20 0 L20 40 M0 20 L40 20" stroke="rgba(13,220,122,0.18)" stroke-width="2"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="800" fill="url(#g)"/>

  <!-- vignette -->
  <radialGradient id="v" cx="50%" cy="35%" r="75%">
    <stop offset="0" stop-color="rgba(0,0,0,0)"/>
    <stop offset="1" stop-color="rgba(0,0,0,0.55)"/>
  </radialGradient>
  <rect width="1200" height="800" fill="url(#v)"/>

  <!-- goal frame -->
  <g filter="url(#soft)" opacity="0.95">
    <rect x="210" y="120" width="780" height="520" rx="26" fill="rgba(255,255,255,0.02)" stroke="rgba(13,220,122,0.50)" stroke-width="10"/>
    <rect x="250" y="160" width="700" height="440" rx="18" fill="url(#net)" stroke="rgba(13,220,122,0.25)" stroke-width="2"/>
    <!-- posts highlight -->
    <path d="M235 150 L235 610 M965 150 L965 610 M235 150 L965 150" stroke="rgba(185,255,224,0.45)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- subtle floor lines -->
  <g opacity="0.25">
    <path d="M0 690 H1200" stroke="rgba(13,220,122,0.18)" stroke-width="2"/>
    <path d="M0 730 H1200" stroke="rgba(13,220,122,0.12)" stroke-width="2"/>
  </g>
</svg>
